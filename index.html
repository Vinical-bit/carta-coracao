<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta Lacrada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Pinyon+Script&family=Courier+Prime&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29 C7 22 2 17 2 10.5 C2 6 5.5 3 9.5 3 C12.5 3 14.8 4.8 16 7.2 C17.2 4.8 19.5 3 22.5 3 C26.5 3 30 6 30 10.5 C30 17 25 22 16 29Z' fill='%23e3122b'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="tela" aria-label="Coração formado pela frase eu te amo em vinte idiomas" role="img"></canvas>

<main class="stage" id="stage">
  <p class="top">Uma carta pra você</p>
  <div class="envelope" id="env">
    <div class="env-back"></div>
    <div class="env-front" aria-hidden="true">
      <svg viewBox="0 0 700 500" preserveAspectRatio="none">
        <polygon points="0,500 350,250 700,500" fill="#e3d4b3"/>
        <polygon points="0,0 350,265 0,500" fill="#e7d9bc"/>
        <polygon points="700,0 350,265 700,500" fill="#e1d1ae"/>
      </svg>
    </div>
    <div class="flap" aria-hidden="true">
      <svg viewBox="0 0 700 290" preserveAspectRatio="none">
        <polygon points="0,0 700,0 350,290" fill="#dccaa4" stroke="#c7b289" stroke-width="2"/>
      </svg>
    </div>
    <p class="addr" id="addr"></p>
    <button type="button" class="seal" id="seal" aria-label="Quebrar o selo e abrir a carta">
      <span class="pulse" aria-hidden="true"></span>
      <span class="half l" aria-hidden="true"><svg viewBox="0 0 76 76"><defs><radialGradient id="w1" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#c4363d"/><stop offset="1" stop-color="#6e1218"/></radialGradient></defs>
        <path d="M38 3 C29 2 19 6 12 13 C4 21 1 32 3 43 C5 55 13 65 25 71 C29 74 34 75 38 75 L35 57 L41 45 L34 32 L40 19 Z" fill="url(#w1)"/>
        <path d="M38 50 C30 44 22 38 22 31 C22 26 26 23 30 23 C33 23 36 25 38 28" fill="none" stroke="#4d0b10" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <span class="half r" aria-hidden="true"><svg viewBox="0 0 76 76"><defs><radialGradient id="w2" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#b52e35"/><stop offset="1" stop-color="#6e1218"/></radialGradient></defs>
        <path d="M38 3 C47 2 57 6 64 13 C72 21 75 32 73 43 C71 55 63 65 51 71 C47 74 42 75 38 75 L35 57 L41 45 L34 32 L40 19 Z" fill="url(#w2)"/>
        <path d="M38 50 C46 44 54 38 54 31 C54 26 50 23 46 23 C43 23 40 25 38 28" fill="none" stroke="#4d0b10" stroke-width="2.4" stroke-linecap="round"/></svg></span>
    </button>
  </div>
  <p class="hint" id="hint">Toque no selo para abrir</p>
</main>

<button type="button" class="again" id="again" hidden>Ver de novo</button>

<script src="script.js"></script>
</body>
</html>
